<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="One.MessageTracing links every message by correlation and causation IDs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .t  { font: 700 24px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .s  { font: 400 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .n  { font: 700 16px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .k  { font: 500 12px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #94a3b8; }
      .id { font: 600 12px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #5eead4; }
      .cs { font: 600 12px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #a78bfa; }
      .msg { fill: #111a33; stroke: #2a3558; stroke-width: 2; }
      .m1 { animation: hl 4.5s infinite; } .m2 { animation: hl 4.5s 1.1s infinite; }
      .m3 { animation: hl 4.5s 2.2s infinite; } .m4 { animation: hl 4.5s 3.3s infinite; }
      .link { fill: none; stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 5 8; animation: dash 1.4s linear infinite; }
      .corr { stroke: #5eead4; stroke-width: 2; stroke-opacity: .5; }
      @keyframes hl { 0%,100% { stroke: #2a3558; } 6%,18% { stroke: #5eead4; } }
      @keyframes dash { to { stroke-dashoffset: -26; } }
      @media (prefers-reduced-motion: reduce) { .m1, .m2, .m3, .m4, .link { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <text x="48" y="58" class="t">One.MessageTracing · follow any chain of events</text>
  <text x="48" y="86" class="s">Each message records its own ID, the conversation it belongs to (correlation) and what caused it (causation).</text>

  <!-- shared correlation rail -->
  <line x1="48" y1="250" x2="1152" y2="250" class="corr"/>
  <text x="48" y="270" class="id">correlation: 7f3a</text>

  <!-- messages -->
  <g transform="translate(48 118)">
    <rect class="msg m1" width="240" height="108" rx="12"/>
    <text x="20" y="32" class="n">PlaceOrder</text>
    <text x="20" y="58" class="k">id</text><text x="96" y="58" class="id">a1</text>
    <text x="20" y="80" class="k">caused by</text><text x="96" y="80" class="k">—</text>
  </g>
  <g transform="translate(336 118)">
    <rect class="msg m2" width="240" height="108" rx="12"/>
    <text x="20" y="32" class="n">OrderPlaced</text>
    <text x="20" y="58" class="k">id</text><text x="96" y="58" class="id">b2</text>
    <text x="20" y="80" class="k">caused by</text><text x="96" y="80" class="cs">a1</text>
  </g>
  <g transform="translate(624 118)">
    <rect class="msg m3" width="240" height="108" rx="12"/>
    <text x="20" y="32" class="n">ReserveStock</text>
    <text x="20" y="58" class="k">id</text><text x="96" y="58" class="id">c3</text>
    <text x="20" y="80" class="k">caused by</text><text x="96" y="80" class="cs">b2</text>
  </g>
  <g transform="translate(912 118)">
    <rect class="msg m4" width="240" height="108" rx="12"/>
    <text x="20" y="32" class="n">StockReserved</text>
    <text x="20" y="58" class="k">id</text><text x="96" y="58" class="id">d4</text>
    <text x="20" y="80" class="k">caused by</text><text x="96" y="80" class="cs">c3</text>
  </g>

  <path class="link" d="M288 172 H336"/>
  <path class="link" d="M576 172 H624"/>
  <path class="link" d="M864 172 H912"/>
  <g fill="#5eead4">
    <circle cx="168" cy="250" r="4"/><circle cx="456" cy="250" r="4"/>
    <circle cx="744" cy="250" r="4"/><circle cx="1032" cy="250" r="4"/>
  </g>
  <g stroke="#5eead4" stroke-opacity=".35" stroke-width="1.5">
    <line x1="168" y1="226" x2="168" y2="246"/><line x1="456" y1="226" x2="456" y2="246"/>
    <line x1="744" y1="226" x2="744" y2="246"/><line x1="1032" y1="226" x2="1032" y2="246"/>
  </g>
</svg>
