<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Time-travel queries: read a projection exactly as it was at any point in time">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .t   { font: 700 24px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .s   { font: 400 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .c   { font: 600 15px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #5eead4; }
      .lb  { font: 600 11px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #94a3b8; letter-spacing: 1px; }
      .ev  { font: 600 12px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #c7d2fe; }
      .day { font: 500 11px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #64748b; }
      .k   { font: 500 13px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #94a3b8; }
      .v   { font: 700 13px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #f8fafc; }
      .head { animation: move 10s ease-in-out infinite; }
      .st  { opacity: 0; animation: show 10s infinite; }
      .s2 { animation-delay: 2s } .s3 { animation-delay: 4s } .s4 { animation-delay: 6s } .s5 { animation-delay: 8s }
      @keyframes move {
        0%, 16%   { transform: translateX(0); }
        20%, 36%  { transform: translateX(220px); }
        40%, 56%  { transform: translateX(440px); }
        60%, 76%  { transform: translateX(660px); }
        80%, 96%  { transform: translateX(880px); }
        100%      { transform: translateX(0); }
      }
      @keyframes show { 0% { opacity: 0; } 3%, 18% { opacity: 1; } 21%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .head, .st { animation: none; } .st.s1 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <text x="48" y="56" class="t">Time-travel queries</text>
  <text x="48" y="84" class="s">Every projection keeps its history, so you can read it exactly as it was at any moment.</text>
  <text x="1152" y="56" class="c" text-anchor="end">GetAsOfAsync&lt;OrderSummary&gt;(id, when)</text>

  <!-- timeline -->
  <line x1="60" y1="262" x2="1140" y2="262" stroke="#2a3558" stroke-width="2"/>
  <g>
    <circle cx="160" cy="262" r="6" fill="#a78bfa"/><text x="160" y="288" class="ev" text-anchor="middle">OrderPlaced</text><text x="160" y="306" class="day" text-anchor="middle">Mon 09:14</text>
    <circle cx="380" cy="262" r="6" fill="#a78bfa"/><text x="380" y="288" class="ev" text-anchor="middle">ItemAdded</text><text x="380" y="306" class="day" text-anchor="middle">Tue 11:02</text>
    <circle cx="600" cy="262" r="6" fill="#a78bfa"/><text x="600" y="288" class="ev" text-anchor="middle">ItemAdded</text><text x="600" y="306" class="day" text-anchor="middle">Wed 16:40</text>
    <circle cx="820" cy="262" r="6" fill="#a78bfa"/><text x="820" y="288" class="ev" text-anchor="middle">DiscountApplied</text><text x="820" y="306" class="day" text-anchor="middle">Thu 08:30</text>
    <circle cx="1040" cy="262" r="6" fill="#a78bfa"/><text x="1040" y="288" class="ev" text-anchor="middle">OrderShipped</text><text x="1040" y="306" class="day" text-anchor="middle">Fri 14:55</text>
  </g>

  <!-- playhead + state card -->
  <g class="head">
    <line x1="160" y1="216" x2="160" y2="262" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="160" cy="262" r="10" fill="none" stroke="#5eead4" stroke-width="2"/>
    <rect x="50" y="112" width="220" height="104" rx="12" fill="#111a33" stroke="url(#accent)" stroke-width="2"/>
    <text x="70" y="138" class="lb">STATE AS OF</text>
    <text x="70" y="166" class="k">status</text>
    <text x="70" y="192" class="k">items</text>
    <text x="160" y="192" class="k">total</text>

    <g class="st s1"><text x="174" y="138" class="lb" style="fill:#5eead4">MON 09:14</text><text x="130" y="166" class="v">placed</text><text x="120" y="192" class="v">1</text><text x="208" y="192" class="v">€40</text></g>
    <g class="st s2"><text x="174" y="138" class="lb" style="fill:#5eead4">TUE 11:02</text><text x="130" y="166" class="v">placed</text><text x="120" y="192" class="v">2</text><text x="208" y="192" class="v">€65</text></g>
    <g class="st s3"><text x="174" y="138" class="lb" style="fill:#5eead4">WED 16:40</text><text x="130" y="166" class="v">placed</text><text x="120" y="192" class="v">3</text><text x="208" y="192" class="v">€80</text></g>
    <g class="st s4"><text x="174" y="138" class="lb" style="fill:#5eead4">THU 08:30</text><text x="130" y="166" class="v">placed</text><text x="120" y="192" class="v">3</text><text x="208" y="192" class="v">€68</text></g>
    <g class="st s5"><text x="174" y="138" class="lb" style="fill:#5eead4">FRI 14:55</text><text x="130" y="166" class="v" style="fill:#5eead4">shipped</text><text x="120" y="192" class="v">3</text><text x="208" y="192" class="v">€68</text></g>
  </g>
</svg>
