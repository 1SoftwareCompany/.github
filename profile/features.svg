<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="398" viewBox="0 0 1200 398" role="img" aria-label="1nception features: versioned projections, time-travel reads, replay, multitenancy, stream integrity, migrations, ops API, auto-updates">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d38"/>
      <stop offset="1" stop-color="#0d1328"/>
    </linearGradient>
    <style>
      .h  { font: 700 20px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .p  { font: 400 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #a5b4fc; }
      .k  { font: 700 13px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #5eead4; letter-spacing: 1px; }
      .hl { opacity: 0; animation: hl 8s ease-in-out infinite; }
      @keyframes hl { 0%, 100% { opacity: 0; } 5%, 10% { opacity: 1; } 18% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
    </style>
  </defs>
  <g>
    <rect x="2" y="2" width="280" height="186" rx="16" fill="url(#card)" stroke="#2a3558"/>
    <rect x="2" y="2" width="280" height="186" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="hl" style="animation-delay:0s"/>
    <text x="24" y="42" class="k">01</text>
    <text x="24" y="82" class="h">Versioned projections</text>
    <text x="24" y="120" class="p">Change the handlers and deploy.</text><text x="24" y="141" class="p">A new version rebuilds in the</text><text x="24" y="162" class="p">background, the old one serves.</text>
  </g>
  <g>
    <rect x="308" y="2" width="280" height="186" rx="16" fill="url(#card)" stroke="#2a3558"/>
    <rect x="308" y="2" width="280" height="186" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="hl" style="animation-delay:1s"/>
    <text x="330" y="42" class="k">02</text>
    <text x="330" y="82" class="h">Time-travel reads</text>
    <text x="330" y="120" class="p">Load any projection exactly as</text><text x="330" y="141" class="p">it was at any moment in time.</text>
  </g>
  <g>
    <rect x="614" y="2" width="280" height="186" rx="16" fill="url(#card)" stroke="#2a3558"/>
    <rect x="614" y="2" width="280" height="186" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="hl" style="animation-delay:2s"/>
    <text x="636" y="42" class="k">03</text>
    <text x="636" y="82" class="h">Replay anything</text>
    <text x="636" y="120" class="p">Replay events into projections,</text><text x="636" y="141" class="p">republish public events to</text><text x="636" y="162" class="p">other bounded contexts.</text>
  </g>
  <g>
    <rect x="920" y="2" width="280" height="186" rx="16" fill="url(#card)" stroke="#2a3558"/>
    <rect x="920" y="2" width="280" height="186" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="hl" style="animation-delay:3s"/>
    <text x="942" y="42" class="k">04</text>
    <text x="942" y="82" class="h">Multitenant by design</text>
    <text x="942" y="120" class="p">The tenant is part of every ID.</text><text x="942" y="141" class="p">Wipe a tenant&#39;s data with a</text><text x="942" y="162" class="p">single call.</text>
  </g>
  <g>
    <rect x="2" y="210" width="280" height="186" rx="16" fill="url(#card)" stroke="#2a3558"/>
    <rect x="2" y="210" width="280" height="186" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="hl" style="animation-delay:4s"/>
    <text x="24" y="250" class="k">05</text>
    <text x="24" y="290" class="h">Stream integrity</text>
    <text x="24" y="328" class="p">Every stream is checked on load</text><text x="24" y="349" class="p">for missing, duplicate and</text><text x="24" y="370" class="p">out-of-order revisions.</text>
  </g>
  <g>
    <rect x="308" y="210" width="280" height="186" rx="16" fill="url(#card)" stroke="#2a3558"/>
    <rect x="308" y="210" width="280" height="186" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="hl" style="animation-delay:5s"/>
    <text x="330" y="250" class="k">06</text>
    <text x="330" y="290" class="h">Event store migrations</text>
    <text x="330" y="328" class="p">Copy and transform the event</text><text x="330" y="349" class="p">store into new storage with</text><text x="330" y="370" class="p">migration handlers.</text>
  </g>
  <g>
    <rect x="614" y="210" width="280" height="186" rx="16" fill="url(#card)" stroke="#2a3558"/>
    <rect x="614" y="210" width="280" height="186" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="hl" style="animation-delay:6s"/>
    <text x="636" y="250" class="k">07</text>
    <text x="636" y="290" class="h">Ops API built in</text>
    <text x="636" y="328" class="p">Explore aggregates and events,</text><text x="636" y="349" class="p">rebuild, pause or cancel</text><text x="636" y="370" class="p">projections over HTTP.</text>
  </g>
  <g>
    <rect x="920" y="210" width="280" height="186" rx="16" fill="url(#card)" stroke="#2a3558"/>
    <rect x="920" y="210" width="280" height="186" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="hl" style="animation-delay:7s"/>
    <text x="942" y="250" class="k">08</text>
    <text x="942" y="290" class="h">Auto-updates</text>
    <text x="942" y="328" class="p">A source generator wires up</text><text x="942" y="349" class="p">upgrades between major</text><text x="942" y="370" class="p">versions, applied per tenant.</text>
  </g>
</svg>
